<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Financial Wallet / Brain AI Symbol -->
  <g filter="url(#glow)" transform="translate(40, 40)">
    <!-- Main Card Body -->
    <rect x="76" y="140" width="280" height="180" rx="28" fill="none" stroke="url(#accentGrad)" stroke-width="20"/>
    <path d="M 120 140 L 120 110 C 120 80 150 60 216 60 C 282 60 312 80 312 110 L 312 140" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- AI Sparkle / Trend Up Arrow -->
    <path d="M 130 260 L 190 200 L 230 230 L 300 160" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="260,160 300,160 300,200" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pulse Dot -->
    <circle cx="300" cy="160" r="14" fill="#34d399"/>
  </g>
</svg>
